name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegispay
          POSTGRES_PASSWORD: aegispay
          POSTGRES_DB: aegispay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegispay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aegispay:aegispay@localhost:5432/aegispay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gateway/requirements.txt
      - name: Install Python dependencies
        run: pip install -r gateway/requirements.txt
      - name: Run gateway migrations
        working-directory: gateway
        run: alembic upgrade head
      - name: Run gateway tests
        working-directory: gateway
        run: pytest -q

  backend-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend-gateway
        working-directory: backend-gateway
        run: mvn -B -DskipTests package

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json
      - name: Install contract dependencies
        working-directory: blockchain
        run: npm ci
      - name: Run contract tests
        working-directory: blockchain
        run: npx hardhat test
